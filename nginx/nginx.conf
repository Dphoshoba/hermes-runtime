# EVOSIA Remote M8 — HTTPS termination + reverse proxy.
#
# - TLS 1.2/1.3 only, modern cipher set.
# - Proxies /api and static asset requests to the backend container.
# - Serves / as the SPA (with the backend's catch-all as ultimate fallback).
# - Security headers suitable for a participant-facing surface.

upstream evosia_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    # Force HTTPS for any non-local traffic. Operator smoke test on localhost
    # can also use https://localhost directly via the 443 server block.
    return 301 https://$host:443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificates are mounted from ./certs by docker-compose.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:EVOSIA:10m;

    # Security headers.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    # API + backend routes.
    location /api/ {
        proxy_pass http://evosia_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check.
    location /api/health {
        proxy_pass http://evosia_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → SPA (frontend served by backend's static handler).
    location / {
        proxy_pass http://evosia_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
