[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-runtime-v01"
version = "1.3.0"
description = "Autonomous engineering runtime for deterministic mission execution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Hermes Runtime Team" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

# Enterprise backend (FastAPI service) optional dependency group.
# Declares the full runtime stack required for a clean Enterprise install
# (the previous group declared only passlib/bcrypt and omitted FastAPI,
# Pydantic, SQLAlchemy, Alembic, and the JWT dependency — a
# PACKAGING_DEFENDENCY_DEFECT). passlib + bcrypt are pinned to a
# tested-compatible combination: passlib 1.7.4's bcrypt scheme requires
# bcrypt < 5.0.0 (bcrypt 5 changed the hash-encoding error contract passlib
# 1.7.4 does not expect); bcrypt 4.x is compatible.
[project.optional-dependencies]
enterprise = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic[email]>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib==1.7.4",
    "bcrypt>=4.0.1,<5.0.0",
]

[project.scripts]
hermes-validate = "hermes_v01.__main__:main"
hermes-supervise = "hermes_v01.supervisor_cli:main"
hermes-status = "hermes_v01.status_cli:main"
hermes-record = "hermes_v01.evidence_cli:main"
hermes-review = "hermes_v01.reviewer_cli:main"
hermes-health = "hermes_v01.health_cli:main"
hermes-runtime = "hermes_v01.runtime_cli:main"
hermes-queue = "hermes_v01.work_queue_cli:main"
hermes-metrics = "hermes_v01.metrics_cli:main"
hermes-capabilities = "hermes_v01.capabilities_cli:main"
hermes-plan = "hermes_v01.plan_cli:main"
hermes-mission = "hermes_v01.mission_runner_cli:main"
hermes-repo = "hermes_v01.repo_cli:main"
hermes-engineering = "hermes_v01.engineering_cli:main"
hermes-governance = "hermes_v01.governance_cli:main"
hermes-recommend = "hermes_v01.mission_recommendation_cli:main"
hermes-benchmark = "hermes_v01.benchmark_cli:main"
hermes-ready = "hermes_v01.readiness_cli:main"
hermes-github = "hermes_v01.github_cli:main"
hermes-journal = "hermes_v01.journal_cli:main"
hermes-human-review = "hermes_v01.human_review_cli:main"

[tool.setuptools]
packages = [
    "hermes_v01",
    "enterprise",
    "enterprise.models",
    "enterprise.routers",
    "enterprise.schemas",
    "enterprise.services",
]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]

[tool.setuptools.package-data]
hermes_v01 = ["py.typed"]
enterprise = [
    "migrations/**/*",
    "migrations/*",
    "alembic.ini",
]
