[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evosia-runtime"
version = "1.3.0"
description = "Autonomous engineering runtime for deterministic mission execution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "EVOSIA Runtime Team" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

# Enterprise backend (FastAPI service) optional dependency group.
# Declares the full runtime stack required for a clean Enterprise install
# (the previous group declared only passlib/bcrypt and omitted FastAPI,
# Pydantic, SQLAlchemy, Alembic, and the JWT dependency — a
# PACKAGING_DEFENDENCY_DEFECT). passlib + bcrypt are pinned to a
# tested-compatible combination: passlib 1.7.4's bcrypt scheme requires
# bcrypt < 5.0.0 (bcrypt 5 changed the hash-encoding error contract passlib
# 1.7.4 does not expect); bcrypt 4.x is compatible.
[project.optional-dependencies]
enterprise = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic[email]>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib==1.7.4",
    "bcrypt>=4.0.1,<5.0.0",
]

[project.scripts]
hermes-validate = "evosia.__main__:main"
hermes-supervise = "evosia.supervisor_cli:main"
hermes-status = "evosia.status_cli:main"
hermes-record = "evosia.evidence_cli:main"
hermes-review = "evosia.reviewer_cli:main"
hermes-health = "evosia.health_cli:main"
hermes-runtime = "evosia.runtime_cli:main"
hermes-queue = "evosia.work_queue_cli:main"
hermes-metrics = "evosia.metrics_cli:main"
hermes-capabilities = "evosia.capabilities_cli:main"
hermes-plan = "evosia.plan_cli:main"
hermes-mission = "evosia.mission_runner_cli:main"
hermes-repo = "evosia.repo_cli:main"
hermes-engineering = "evosia.engineering_cli:main"
hermes-governance = "evosia.governance_cli:main"
hermes-recommend = "evosia.mission_recommendation_cli:main"
hermes-benchmark = "evosia.benchmark_cli:main"
hermes-ready = "evosia.readiness_cli:main"
hermes-github = "evosia.github_cli:main"
hermes-journal = "evosia.journal_cli:main"
hermes-human-review = "evosia.human_review_cli:main"

[tool.setuptools]
packages = [
    "evosia",
    "enterprise",
    "enterprise.models",
    "enterprise.routers",
    "enterprise.schemas",
    "enterprise.services",
]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]

[tool.setuptools.package-data]
evosia = ["py.typed"]
enterprise = [
    "migrations/**/*",
    "migrations/*",
    "alembic.ini",
]
